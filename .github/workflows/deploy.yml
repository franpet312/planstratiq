name: Build i objava (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dopuni web projekt (ikone, manifest)
        run: |
          cp web/index.html /tmp/index.html
          flutter create . --platforms web --project-name planstratiq
          cp /tmp/index.html web/index.html
          rm -rf test

      - run: flutter pub get

      - name: Analiza koda
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # kopija gotove aplikacije na grani web-build (za automatske provjere u pregledniku)
      - name: Kopija builda (grana web-build)
        if: github.event_name == 'push'
        run: |
          cd build/web
          git init -q -b web-build
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" web-build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
