name: Build i objava (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dopuni web projekt (ikone, manifest)
        run: |
          cp web/index.html /tmp/index.html
          flutter create . --platforms web --project-name planstratiq
          cp /tmp/index.html web/index.html
          rm -rf test

      - run: flutter pub get

      - name: Analiza koda
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
